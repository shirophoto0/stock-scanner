name: Weekly Firestore to Sheets Backup
on:
  schedule:
    - cron: '0 17 * * 0'  # เที่ยงคืนวันจันทร์เวลาประเทศไทย (00:00 ICT จันทร์ = 17:00 UTC อาทิตย์)
  workflow_dispatch:        # ให้กดรันเองได้ด้วย
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backup script
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          FIREBASE_APPLICATION_CREDENTIALS: ${{ secrets.FIREBASE_APPLICATION_CREDENTIALS }}
        run: |
          python backup_firestore_to_sheets.py --apply
