name: Monthly Net Worth Report
on:
  schedule:
    # ทุกวันที่ 1 ของเดือน เวลา 10:00 UTC = 17:00 น. เวลาไทย (หลัง Daily Scan วันที่ 1 ทำงานเสร็จ
    # พอดี ข้อมูลแนวโน้มจะได้ครบถ้วนล่าสุด)
    - cron: '0 10 1 * *'
  workflow_dispatch:        # ให้กดรันเองได้ด้วย เพื่อทดสอบ
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Monthly Report Script
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_PARTNER: ${{ secrets.TELEGRAM_CHAT_ID_PARTNER }}
        run: |
          python monthly_report.py
