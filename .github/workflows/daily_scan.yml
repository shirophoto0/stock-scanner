name: Daily Stock Scanner
on:
  schedule:
    - cron: '36 7 * * *'  # ตั้งเวลา 14:36 น. ICT (ถอยจากเดิม 3 ชม. เพื่อชดเชย delay ของ GitHub Actions scheduler ที่สังเกตได้ ~4 ชม. เป้าหมายให้รันจริงราว 17:30-18:30 น. — 2026-09-09 เริ่ม monitor)
  workflow_dispatch:        # ให้กดรันเองได้ด้วย
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Scan Script
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          FIREBASE_APPLICATION_CREDENTIALS: ${{ secrets.FIREBASE_APPLICATION_CREDENTIALS }}
          FIRESTORE_ENABLED_SHEETS: "MyStockData,Nujiwealth"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_PARTNER: ${{ secrets.TELEGRAM_CHAT_ID_PARTNER }}
        run: |
          python daily_scan.py
